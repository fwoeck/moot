[project]
name = "moot"
version = "0.1.0"
description = "Multi-agent message bus for local LLM coding sessions"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
moot = "moot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moot"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "mypy",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["moot"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.coverage.run]
source = ["src/moot"]
branch = true

[tool.coverage.report]
show_missing = true
